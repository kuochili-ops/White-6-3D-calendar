<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>𓃥 白六立體週曆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #EAE6DF;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .glass-panel {
      background: rgba(255, 253, 249, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -5px rgba(68, 51, 34, 0.15);
    }
    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(217, 119, 6, 0.55); }
      50% { border-color: rgba(217, 119, 6, 1); }
    }
    .drop-active {
      animation: pulseBorder 1.2s infinite;
    }
  </style>
  <!-- Reliable Three.js r160 ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="select-none">

  <!-- Fullscreen 3D Viewport Container -->
  <div id="canvas-container"></div>

  <!-- Drag & Drop File Overlay -->
  <div id="drop-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-950/65 backdrop-blur-sm p-6 pointer-events-none">
    <div class="w-full max-w-md rounded-3xl border-4 border-dashed border-amber-400 bg-white/95 p-8 text-center shadow-2xl drop-active">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-amber-100 text-amber-700 text-3xl">
        𓃥
      </div>
      <h3 class="text-xl font-bold text-stone-800">放開以替換立體框內的白六模型</h3>
      <p class="mt-2 text-sm text-stone-500">將自動縮放並置中於上方展示框內，完全不碰觸框壁</p>
    </div>
  </div>

  <!-- Toast Notification Stack (Zero alert() usage) -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-sm px-4"></div>

  <!-- Floating Restore Button (Visible ONLY when UI is collapsed) -->

    <svg class="h-3.5 w-3.5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    <span>展開介面</span>
  </button>

  <!-- Top Header Overlay -->
  <header id="ui-header" class="fixed top-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none">
    <div class="mx-auto max-w-6xl flex flex-wrap items-center justify-between gap-2">
      <!-- Title & Live Status Card -->
      <div class="glass-panel pointer-events-auto flex items-center gap-3 rounded-2xl px-3.5 py-2.5">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-amber-600 to-rose-800 text-white shadow-md text-lg font-bold">
          𓃥
        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <h1 id="main-calendar-title" class="text-xs sm:text-base font-extrabold text-stone-800 leading-tight">
              𓃥 白六立體週曆 (自動偵測系統當週)
            </h1>
            <span id="status-badge" class="rounded-full bg-emerald-100 border border-emerald-400/60 px-2.5 py-0.5 text-[10px] sm:text-[11px] font-bold text-emerald-800">

          </div>
          <p id="model-stats" class="text-[11px] sm:text-xs text-stone-600 mt-0.5">正在初始化 3D 立體框與本週日曆網格...</p>

      <!-- Primary Actions -->
      <div class="pointer-events-auto flex flex-wrap items-center gap-1.5 sm:gap-2">
        <button id="btn-collapse-ui" type="button" title="收合所有介面，只顯示 3D 模型 (快捷鍵 H)" class="glass-panel flex items-center gap-1.5 rounded-2xl px-3 py-2.5 text-xs sm:text-sm font-semibold text-stone-700 hover:bg-white active:scale-95 transition">
          <svg class="h-4 w-4 text-stone-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
          <span>收合介面</span>
        </button>

        <label for="glb-file-input" class="glass-panel cursor-pointer flex items-center gap-1.5 rounded-2xl px-3 py-2.5 text-xs sm:text-sm font-semibold text-stone-700 hover:bg-white active:scale-95 transition">
          <svg class="h-4 w-4 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span>匯入白六 .glb</span>
        </label>
        <input id="glb-file-input" type="file" accept=".glb,.gltf" class="hidden" />

        <button id="btn-restore-bailiu" type="button" class="hidden glass-panel items-center gap-1 rounded-2xl px-3 py-2.5 text-xs sm:text-sm font-semibold text-emerald-700 hover:bg-white active:scale-95 transition">
          <span>恢復內建白六</span>
        </button>

        <button id="btn-export-glb" type="button" class="flex items-center gap-1.5 rounded-2xl bg-gradient-to-r from-amber-600 via-orange-600 to-rose-700 px-4 py-2.5 text-xs sm:text-sm font-bold text-white shadow-lg shadow-amber-800/30 hover:from-amber-500 hover:to-rose-600 active:scale-95 transition">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>下載立體週曆 .glb</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Bottom Control Dock -->
  <footer id="ui-footer" class="fixed bottom-0 left-0 right-0 z-20 p-3 sm:p-4 pointer-events-none">
    <div class="mx-auto max-w-5xl flex flex-col items-center gap-2">
      <!-- Interaction Hint -->
      <div class="rounded-full bg-stone-900/70 border border-white/15 px-3.5 py-1 text-[11px] text-white backdrop-blur-md">
        點擊下方「日期方塊」可切換凸起標註 · 拖曳 360° 旋轉檢視 · 按 H 鍵一鍵隱藏介面
      </div>

      <!-- Week Navigator & Camera Presets Bar -->
      <div class="flex flex-wrap items-center justify-center gap-2 pointer-events-auto">
        <!-- Week Switcher (Previous / This Week / Next) -->
        <div class="glass-panel flex items-center gap-1 rounded-2xl p-1.5">
          <button id="btn-prev-week" type="button" title="上一週" class="rounded-xl px-2.5 py-1 text-xs font-bold text-stone-700 hover:bg-stone-200/80 active:scale-95 transition">
            ◀ 上週
          </button>
          <button id="btn-this-week" type="button" title="回到系統今日所在週次" class="rounded-xl bg-emerald-600 px-2.5 py-1 text-xs font-bold text-white shadow-sm hover:bg-emerald-500 active:scale-95 transition">
            📅 本週
          </button>
          <button id="btn-next-week" type="button" title="下一週" class="rounded-xl px-2.5 py-1 text-xs font-bold text-stone-700 hover:bg-stone-200/80 active:scale-95 transition">
            下週 ▶
          </button>
        </div>

        <!-- Camera Presets Bar -->
        <div class="glass-panel flex flex-wrap items-center justify-center gap-1.5 rounded-2xl p-1.5">
          <span class="px-2 text-[11px] font-bold text-stone-600">視角：</span>
          <button data-cam="frontThreeQuarter" class="cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold bg-amber-500 text-stone-950 shadow-sm transition">
            45°立體全覽
          </button>
          <button data-cam="frontStraight" class="cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold text-stone-600 hover:text-stone-900 transition">
            正面展示視角
          </button>
          <button data-cam="calendarCloseup" class="cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold text-stone-600 hover:text-stone-900 transition">
            特寫本週日期
          </button>
          <button data-cam="bailiuCloseup" class="cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold text-stone-600 hover:text-stone-900 transition">
            特寫白六與立耳
          </button>
        </div>
      </div>

      <!-- Frame Material Finish & Animation Controls -->
      <div class="glass-panel pointer-events-auto w-full rounded-3xl p-2 sm:p-2.5 flex flex-wrap items-center justify-between gap-2">
        <!-- 3 Frame Finishes: Walnut Wood / Matte Black / White Oak -->
        <div class="flex items-center gap-1 bg-stone-200/85 p-1 rounded-2xl" role="group" aria-label="立體框材質切換">
          <button data-finish="walnut" class="finish-btn rounded-xl px-2.5 py-1.5 text-xs font-semibold bg-amber-700 text-white shadow-sm transition">
            🪵 胡桃深木
          </button>
          <button data-finish="matteBlack" class="finish-btn rounded-xl px-2.5 py-1.5 text-xs font-semibold text-stone-600 hover:text-stone-900 transition">
            🖤 霧面黑框
          </button>
          <button data-finish="whiteOak" class="finish-btn rounded-xl px-2.5 py-1.5 text-xs font-semibold text-stone-600 hover:text-stone-900 transition">
            🌾 北歐白橡木
          </button>
        </div>

        <!-- Animation, Wireframe & Auto-Rotate Toggles -->
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <button id="btn-anim" type="button" class="flex items-center gap-1.5 rounded-2xl bg-rose-700 px-3 py-2 text-xs font-semibold text-white shadow-sm active:scale-95 transition">
            <span>🐾</span>
            <span>呼吸搖尾</span>
          </button>

          <button id="btn-wireframe" type="button" class="flex items-center gap-1.5 rounded-2xl bg-stone-100 hover:bg-stone-200/80 px-3 py-2 text-xs font-semibold text-stone-700 active:scale-95 transition">
            <svg class="h-3.5 w-3.5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" />
              <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
              <line x1="12" y1="22.08" x2="12" y2="12" />
            </svg>
            <span>網格檢視</span>
          </button>

          <button id="btn-autorotate" type="button" class="flex items-center gap-1.5 rounded-2xl bg-teal-700 px-3 py-2 text-xs font-semibold text-white shadow-sm active:scale-95 transition">
            <svg id="icon-autorotate" class="h-3.5 w-3.5 animate-spin" style="animation-duration: 11s;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>自動旋轉</span>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =========================================================================
    // 1. Toast Notification Helper (Zero alert() usage)
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const styles = {
        info: 'bg-stone-800/95 text-white border-stone-600',
        success: 'bg-emerald-600/95 text-white border-emerald-400',
        error: 'bg-rose-600/95 text-white border-rose-400'
      };
      toast.className = `rounded-2xl border px-4 py-2.5 text-xs sm:text-sm font-medium shadow-2xl backdrop-blur-md transition-all duration-300 ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // =========================================================================
    // 2. Dynamic System Date & Current Week (Sunday - Saturday) Generator
    // =========================================================================
    const ZH_WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const EN_WEEKDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const EN_MONTHS = [
      'JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE',
      'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'
    ];

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    let weekOffset = 0; // 0 = current system week
    let WEEK_DAYS = [];
    let WEEK_META = {
      fullTitle: '',
      plaqueLeft: '',
      plaqueRange: '',
      exportStamp: '',
      todayInfo: null
    };
    let activeDateKey = '';

    function computeDynamicWeekData(offsetWeeks = 0) {
      const now = new Date();
      const todayNormalized = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayKey = formatDateKey(todayNormalized);

      // Find Sunday of the target week (getDay(): 0 = Sun, 6 = Sat)
      const sundayDate = new Date(todayNormalized);
      sundayDate.setDate(todayNormalized.getDate() - todayNormalized.getDay() + offsetWeeks * 7);

      const days = [];
      let foundToday = null;

      for (let i = 0; i < 7; i++) {
        const d = new Date(sundayDate);
        d.setDate(sundayDate.getDate() + i);

        const year = d.getFullYear();
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const key = formatDateKey(d);
        const isToday = key === todayKey;

        const item = {
          key,
          year,
          month,
          day,
          dateStr: `${month}/${day}`,
          zhWeek: ZH_WEEKDAYS[i],
          enWeek: EN_WEEKDAYS[i],
          isWeekend: i === 0 || i === 6,
          isSunday: i === 0,
          isToday
        };
        if (isToday) foundToday = item;
        days.push(item);
      }

      const first = days[0];
      const last = days[6];

      const fullTitle = first.year === last.year
        ? `𓃥 白六立體週曆 (${first.year}年 ${first.month}月${first.day}日 ${first.zhWeek} – ${last.month}月${last.day}日 ${last.zhWeek})`
        : `𓃥 白六立體週曆 (${first.year}/${first.month}/${first.day} ${first.zhWeek} – ${last.year}/${last.month}/${last.day} ${last.zhWeek})`;

      const plaqueLeft = first.month === last.month
        ? `${first.year} 年 ${first.month} 月  ${EN_MONTHS[first.month - 1]}`
        : `${first.year} 年 ${first.month}–${last.month} 月`;

      const plaqueRange = `${first.dateStr} – ${last.dateStr}`;
      const exportStamp = `${first.year}${String(first.month).padStart(2, '0')}${String(first.day).padStart(2, '0')}`;

      WEEK_DAYS = days;
      WEEK_META = {
        fullTitle,
        plaqueLeft,
        plaqueRange,
        exportStamp,
        todayInfo: foundToday || {
          key: todayKey,
          year: todayNormalized.getFullYear(),
          month: todayNormalized.getMonth() + 1,
          day: todayNormalized.getDate(),
          dateStr: `${todayNormalized.getMonth() + 1}/${todayNormalized.getDate()}`,
          zhWeek: ZH_WEEKDAYS[todayNormalized.getDay()],
          isToday: true
        }
      };

      // Highlight today if in current week, otherwise highlight Sunday of viewed week
      activeDateKey = foundToday ? foundToday.key : days[0].key;
    }

    function syncDomWithCurrentWeek() {
      document.title = WEEK_META.fullTitle;
      const titleEl = document.getElementById('main-calendar-title');
      if (titleEl) titleEl.textContent = WEEK_META.fullTitle;

      const selectedItem = WEEK_DAYS.find((d) => d.key === activeDateKey) || WEEK_DAYS[0];
      const badgeEl = document.getElementById('status-badge');
      if (badgeEl && selectedItem) {
        if (selectedItem.isToday) {
          badgeEl.textContent = `● 今日：${selectedItem.dateStr} (${selectedItem.zhWeek})`;
          badgeEl.className = 'rounded-full bg-emerald-100 border border-emerald-400/60 px-2.5 py-0.5 text-[10px] sm:text-[11px] font-bold text-emerald-800';
        } else {
          badgeEl.textContent = `● 已選取：${selectedItem.year}/${selectedItem.dateStr} (${selectedItem.zhWeek}) · 今日 ${WEEK_META.todayInfo.dateStr}`;
          badgeEl.className = 'rounded-full bg-amber-100 border border-amber-400/60 px-2.5 py-0.5 text-[10px] sm:text-[11px] font-bold text-amber-900';
        }
      }
    }

    // Initialize immediately on load using system clock
    computeDynamicWeekData(0);
    syncDomWithCurrentWeek();

    // =========================================================================
    // 3. Three.js Scene, Renderer, Camera & Three-Point Solid Light Rig
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const initWidth = container.clientWidth || window.innerWidth || 1024;
    const initHeight = container.clientHeight || window.innerHeight || 768;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#EAE6DF');

    const camera = new THREE.PerspectiveCamera(38, initWidth / initHeight, 0.1, 150);

    // Tall Shadow-Box total height = ~4.55 units, centered visually around y = 2.30
    const CAMERA_PRESETS = {
      frontThreeQuarter: { pos: new THREE.Vector3(3.35, 3.15, 7.65), target: new THREE.Vector3(0, 2.30, 0.08) },
      frontStraight:     { pos: new THREE.Vector3(0.00, 2.50, 8.35), target: new THREE.Vector3(0, 2.30, 0.08) },
      calendarCloseup:   { pos: new THREE.Vector3(0.00, 1.50, 4.05), target: new THREE.Vector3(0, 0.72, 0.45) },
      bailiuCloseup:     { pos: new THREE.Vector3(2.10, 3.25, 4.45), target: new THREE.Vector3(0, 2.75, 0.15) }
    };

    camera.position.copy(CAMERA_PRESETS.frontThreeQuarter.pos);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(initWidth, initHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(CAMERA_PRESETS.frontThreeQuarter.target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.4;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.update();

    // Three-point lighting + shadows (no external environment map required)
    const hemiLight = new THREE.HemisphereLight('#FFFDF8', '#8C7A6B', 1.38);
    hemiLight.position.set(0, 16, 0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight('#FFF7E8', 2.25);
    keyLight.position.set(5.5, 10.0, 7.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 26;
    const d = 4.5;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const frontFillLight = new THREE.DirectionalLight('#FFFBEB', 0.85);
    frontFillLight.position.set(-3.5, 4.2, 7.0);
    scene.add(frontFillLight);

    const rimLight = new THREE.DirectionalLight('#FDE68A', 0.95);

    // =========================================================================
    // 5. Unified Seamless Lofted Torso-to-Neck Bai Liu 3D Figurine Builder
    // =========================================================================
    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function gaussian(x, mu, sigma) {
      const d = (x - mu) / sigma;
      return Math.exp(-0.5 * d * d);
    }

    function evaluateAnatomySection(u) {
      const u2 = u * u;
      const u3 = u2 * u;
      const inv = 1 - u;
      const inv2 = inv * inv;
      const inv3 = inv2 * inv;

      const cx =
        inv3 * -0.36 +
        3 * inv2 * u * -0.10 +
        3 * inv * u2 * 0.29 +
        u3 * 0.36;

      const cy =
        inv3 * 0.20 +
        3 * inv2 * u * 0.76 +
        3 * inv * u2 * 1.36 +
        u3 * 1.98;

      const baseRx =
        0.54 * (1 - smoothstep(0.0, 0.72, u)) +
        0.30 * smoothstep(0.0, 0.72, u) +
        0.035 * smoothstep(0.82, 1.0, u);

      const baseRz =
        0.51 * (1 - smoothstep(0.0, 0.74, u)) +
        0.275 * smoothstep(0.0, 0.74, u) +
        0.030 * smoothstep(0.82, 1.0, u);

      const chestForwardBulge = 0.14 * gaussian(u, 0.42, 0.13);
      const throatDewlapCurve = 0.055 * gaussian(u, 0.64, 0.11);
      const withersDorsalSlope = 0.11 * gaussian(u, 0.54, 0.14);
      const occiputBackCurve = 0.045 * gaussian(u, 0.92, 0.08);
      const scapulaLateralMuscle = 0.065 * gaussian(u, 0.48, 0.12);
      const collarSeatIndent = -0.011 * gaussian(u, 0.74, 0.026);

      let domeScale = 1.0;
      if (u < 0.05) {
        const t = u / 0.05;
        domeScale = Math.sqrt(Math.max(0.001, 1 - (1 - t) * (1 - t)));
      } else if (u > 0.94) {
        const t = (1.0 - u) / 0.06;
        domeScale = Math.sqrt(Math.max(0.001, 1 - (1 - t) * (1 - t) * 0.75));
      }

      return {
        cx,
        cy,
        rx: (baseRx + collarSeatIndent) * domeScale,
        rz: (baseRz + scapulaLateralMuscle + collarSeatIndent) * domeScale,
        chestForwardBulge: (chestForwardBulge + throatDewlapCurve) * domeScale,
        withersDorsalSlope: (withersDorsalSlope + occiputBackCurve) * domeScale
      };
    }

    function createUnifiedTorsoNeckGeometry(uSteps = 64, vSteps = 48) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      const sections = [];
      for (let i = 0; i <= uSteps; i++) {
        const u = i / uSteps;
        sections.push({ u, ...evaluateAnatomySection(u) });
      }

      for (let i = 0; i <= uSteps; i++) {
        const s = sections[i];
        const prev = sections[Math.max(0, i - 1)];
        const next = sections[Math.min(uSteps, i + 1)];

        const tx = next.cx - prev.cx;
        const ty = next.cy - prev.cy;
        const tLen = Math.hypot(tx, ty) || 1;
        const nx = ty / tLen;
        const ny = -tx / tLen;
        const tiltWeight = 0.52 * Math.sin(Math.PI * Math.pow(s.u, 0.85));

        for (let j = 0; j <= vSteps; j++) {
          const v = j / vSteps;
          const theta = v * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          const frontWeight = Math.max(0, cosT);
          const backWeight = Math.max(0, -cosT);
          const sideWeight = Math.abs(sinT);

          const chestBroadening = 0.032 * Math.pow(frontWeight, 2) * gaussian(s.u, 0.44, 0.14);
          const shoulderContour = 0.028 * Math.pow(sideWeight, 2) * Math.pow(backWeight, 0.5) * gaussian(s.u, 0.50, 0.12);

          const localX =
            cosT * (s.rx + chestBroadening) +
            Math.pow(frontWeight, 1.6) * s.chestForwardBulge -
            Math.pow(backWeight, 1.5) * s.withersDorsalSlope;

          const localZ = sinT * (s.rz + shoulderContour);

          const worldX = s.cx + localX * (1 - tiltWeight + tiltWeight * nx);
          const worldY = s.cy + localX * (tiltWeight * ny);
          const worldZ = localZ;

          positions.push(worldX, worldY, worldZ);
          uvs.push(0.5 + 0.5 * cosT, s.u);
        }
      }

      const ringStride = vSteps + 1;
      for (let i = 0; i < uSteps; i++) {
        for (let j = 0; j < vSteps; j++) {
          const a = i * ringStride + j;
          const b = (i + 1) * ringStride + j;
          const c = (i + 1) * ringStride + (j + 1);
          const dIdx = i * ringStride + (j + 1);

          indices.push(a, dIdx, b);
          indices.push(b, dIdx, c);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function sampleNeckRingTransform(uTarget = 0.74) {
      const eps = 0.005;
      const s = evaluateAnatomySection(uTarget);
      const prev = evaluateAnatomySection(uTarget - eps);
      const next = evaluateAnatomySection(uTarget + eps);

      const tx = next.cx - prev.cx;
      const ty = next.cy - prev.cy;
      const tLen = Math.hypot(tx, ty) || 1;
      const nx = ty / tLen;
      const ny = -tx / tLen;
      const tiltWeight = 0.52 * Math.sin(Math.PI * Math.pow(uTarget, 0.85));

      const frontLocalX = s.rx + s.chestForwardBulge;
      const backLocalX = -(s.rx + s.withersDorsalSlope);

      const frontX = s.cx + frontLocalX * (1 - tiltWeight + tiltWeight * nx);
      const frontY = s.cy + frontLocalX * (tiltWeight * ny);

      const backX = s.cx + backLocalX * (1 - tiltWeight + tiltWeight * nx);
      const backY = s.cy + backLocalX * (tiltWeight * ny);

      const centerX = (frontX + backX) * 0.5;
      const centerY = (frontY + backY) * 0.5;
      const radiusX = Math.hypot(frontX - backX, frontY - backY) * 0.5;
      const radiusZ = s.rz;
      const tiltAngleZ = Math.atan2(frontY - backY, frontX - backX);

      return { centerX, centerY, radiusX, radiusZ, tiltAngleZ };
    }

    function updateHeaderPlaqueTexture() {
      if (!headerPlaqueMesh || !headerPlaqueMesh.material) return;

      headerPlaqueMesh.material.needsUpdate = true;
    }

    function rebuildCalendarTiles() {
      if (!calendarTilesGroup) return;
      while (calendarTilesGroup.children.length > 0) {
        calendarTilesGroup.remove(calendarTilesGroup.children[0]);
      }
      interactiveDayMeshes = [];

      const trayBase = new THREE.Mesh(new THREE.BoxGeometry(3.32, 0.08, 0.96), frameMaterial);
      trayBase.position.set(0, 0.04, 0.14);
      trayBase.receiveShadow = true;
      calendarTilesGroup.add(trayBase);

      const tileW = 0.42;
      const tileH = 0.68;
      const tileD = 0.15;
      const gap = 0.042;
      const totalSpan = 7 * tileW + 6 * gap;
      const startX = -totalSpan / 2 + tileW / 2;

      const matTileSide = new THREE.MeshStandardMaterial({ color: '#E7DEC8', roughness: 0.55 });
      const matTileActiveSide = new THREE.MeshStandardMaterial({ color: '#D99B26', roughness: 0.35, metalness: 0.45 });

      WEEK_DAYS.forEach((dayInfo, idx) => {
        const isActive = dayInfo.key === activeDateKey;
        const tileGroup = new THREE.Group();
        tileGroup.name = `CalendarBlock_${dayInfo.month}_${dayInfo.day}_${dayInfo.enWeek}`;

        const xPos = startX + idx * (tileW + gap);
        const yPos = 0.08 + tileH / 2 + (isActive ? 0.055 : 0);
        const zPos = 0.34 + (isActive ? 0.11 : 0);

        const frontTex = createDayTileTexture(dayInfo, isActive);
        const matFront = new THREE.MeshStandardMaterial({
          map: frontTex,
          roughness: 0.36,
          metalness: 0.04
        });
        const sideMat = isActive ? matTileActiveSide : matTileSide;

        const blockMesh = new THREE.Mesh(
          new THREE.BoxGeometry(tileW, tileH, tileD),
          [sideMat, sideMat, sideMat, sideMat, matFront, sideMat]
        );
        blockMesh.castShadow = true;
        blockMesh.receiveShadow = true;
        blockMesh.userData = { dayInfo };
        interactiveDayMeshes.push(blockMesh);
        tileGroup.add(blockMesh);

        if (isActive) {
          const badgeCrest = new THREE.Mesh(
            new THREE.BoxGeometry(tileW * 0.72, 0.06, tileD + 0.03),
            brassMaterial
          );
          badgeCrest.position.set(0, tileH / 2 + 0.03, 0);
          tileGroup.add(badgeCrest);
        }

        tileGroup.position.set(xPos, yPos, zPos);
        tileGroup.rotation.x = -0.09;
        calendarTilesGroup.add(tileGroup);
      });
    }

    // =========================================================================

    function updateModelStats() {
      let triCount = 0;
      weeklyCalendarObj.traverse((obj) => {
        if (obj.isMesh && obj.visible) {
          const g = obj.geometry;
          if (g.index) triCount += g.index.count / 3;
          else if (g.attributes.position) triCount += g.attributes.position.count / 3;
        }
      });
      document.getElementById('model-stats').textContent =
        `已自動同步系統日期 · 加高展示框 (淨高 2.95) · 實體白六與 7 日立體方塊 (${Math.round(triCount).toLocaleString()} 面)`;
    }
    updateModelStats();

    function switchToWeekOffset(newOffset) {
      weekOffset = newOffset;

      updateHeaderPlaqueTexture();

    document.getElementById('btn-prev-week').addEventListener('click', () => {

    document.getElementById('btn-this-week').addEventListener('click', () => {

    // Click any of the 7 calendar blocks to pop it forward
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 6) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactiveDayMeshes, false);
      if (hits.length > 0) {
        const info = hits[0].object.userData.dayInfo;
        if (info) {
          activeDateKey = info.key;
          syncDomWithCurrentWeek();
          rebuildCalendarTiles();
          showToast(`已凸起標註：${info.year}/${info.dateStr}（${info.zhWeek}）`, 'info');

    // =========================================================================
    // 8. Import External Custom Bailiu .glb (Auto-Scaled & Centered)
    // =========================================================================
    const gltfLoader = new GLTFLoader();
    let customLoadedGroup = null;

    function loadCustomFigurineIntoFrame(file) {
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext !== 'glb' && ext !== 'gltf') {
        showToast('請選擇有效的 .glb 或 .gltf 檔案', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        gltfLoader.parse(
          ev.target.result,
          '',
          (gltf) => {
            const loaded = gltf.scene;
            loaded.traverse((c) => {
              if (c.isMesh) {
                c.castShadow = true;
                c.receiveShadow = true;
              }
            });

            const box = new THREE.Box3().setFromObject(loaded);
            if (!box.isEmpty()) {
              const size = box.getSize(new THREE.Vector3());
              const center = box.getCenter(new THREE.Vector3());
              const maxAllowedH = UPPER_CHAMBER_CLEAR_HEIGHT * 0.80;
              const maxAllowedW = UPPER_CHAMBER_CLEAR_WIDTH * 0.82;
              const scaleH = maxAllowedH / (size.y || 1);
              const scaleW = maxAllowedW / (Math.max(size.x, size.z) || 1);
              const s = Math.min(scaleH, scaleW);

              loaded.scale.setScalar(s);
              loaded.position.x = -center.x * s;
              loaded.position.z = -center.z * s;
              loaded.position.y = -box.min.y * s;
            }

            if (customLoadedGroup) {
              figurineHolderGroup.remove(customLoadedGroup);
            }
            builtInBaiLiuGroup.visible = false;
            customLoadedGroup = loaded;
            customLoadedGroup.name = 'CustomImportedBaiLiu';
            figurineHolderGroup.add(customLoadedGroup);

            const restoreBtn = document.getElementById('btn-restore-bailiu');
            restoreBtn.classList.remove('hidden');
            restoreBtn.classList.add('flex');

            updateModelStats();
            showToast(`已成功匯入「${file.name}」並置中於立體框內！`, 'success');
          },
          (err) => {
            console.error(err);
            showToast('無法解析此 GLB/GLTF 檔案', 'error');
          }
        );
      };
      reader.readAsArrayBuffer(file);
    }

    document.getElementById('glb-file-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) loadCustomFigurineIntoFrame(file);
      e.target.value = '';

    document.getElementById('btn-restore-bailiu').addEventListener('click', () => {

    // Drag & Drop support
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.remove('hidden');
      dropOverlay.classList.add('flex');
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.add('hidden');
        dropOverlay.classList.remove('flex');
      }
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.add('hidden');
      dropOverlay.classList.remove('flex');
      const file = e.dataTransfer?.files?.[0];

    let isUiCollapsed = false;

    function setUiCollapsed(collapsed) {

        uiFooter.classList.add('hidden');
        btnExpandUi.classList.remove('hidden');
        btnExpandUi.classList.add('flex');
      } else {
        uiHeader.classList.remove('hidden');

      }
      if (animParts.tagGroup) {
        animParts.tagGroup.rotation.z = -sampleNeckRingTransform(0.74).tiltAngleZ;
      }
    }

    document.querySelectorAll('.finish-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.finish;
        frameMaterial.map = createFrameFinishTexture(key);
        frameMaterial.roughness = key === 'matteBlack' ? 0.68 : 0.48;
        frameMaterial.needsUpdate = true;

        document.querySelectorAll('.finish-btn').forEach((b) => {
          if (b.dataset.finish === key) {
            b.className = 'finish-btn rounded-xl px-2.5 py-1.5 text-xs font-semibold bg-amber-700 text-white shadow-sm transition';
          } else {
            b.className = 'finish-btn rounded-xl px-2.5 py-1.5 text-xs font-semibold text-stone-600 hover:text-stone-900 transition';
          }
        });
      });
    });

    document.querySelectorAll('.cam-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.cam;
        const p = CAMERA_PRESETS[key];
        if (!p) return;

        camera.position.copy(p.pos);
        controls.target.copy(p.target);
        controls.update();

        document.querySelectorAll('.cam-btn').forEach((b) => {
          if (b.dataset.cam === key) {
            b.className = 'cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold bg-amber-500 text-stone-950 shadow-sm transition';
          } else {
            b.className = 'cam-btn rounded-xl px-2.5 py-1 text-xs font-semibold text-stone-600 hover:text-stone-900 transition';
          }
        });
      });
    });

    const btnAnim = document.getElementById('btn-anim');
    btnAnim.addEventListener('click', () => {
      isLifeAnim = !isLifeAnim;
      if (isLifeAnim) {
        btnAnim.className = 'flex items-center gap-1.5 rounded-2xl bg-rose-700 px-3 py-2 text-xs font-semibold text-white shadow-sm active:scale-95 transition';
      } else {
        btnAnim.className = 'flex items-center gap-1.5 rounded-2xl bg-stone-600 hover:bg-stone-500 px-3 py-2 text-xs font-semibold text-white active:scale-95 transition';
        resetPoseToStatic();
      }
    });

    const btnWireframe = document.getElementById('btn-wireframe');
    btnWireframe.addEventListener('click', () => {
      isWireframe = !isWireframe;
      weeklyCalendarObj.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            m.wireframe = isWireframe;
          });
        }
      });
      if (isWireframe) {
        btnWireframe.classList.add('ring-2', 'ring-indigo-500');
      } else {
        btnWireframe.classList.remove('ring-2', 'ring-indigo-500');
      }
    });

    const btnAutoRotate = document.getElementById('btn-autorotate');
    const iconAutoRotate = document.getElementById('icon-autorotate');
    btnAutoRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      if (controls.autoRotate) {
        btnAutoRotate.className = 'flex items-center gap-1.5 rounded-2xl bg-teal-700 px-3 py-2 text-xs font-semibold text-white shadow-sm active:scale-95 transition';
        iconAutoRotate.classList.add('animate-spin');
      } else {
        btnAutoRotate.className = 'flex items-center gap-1.5 rounded-2xl bg-stone-600 hover:bg-stone-500 px-3 py-2 text-xs font-semibold text-white active:scale-95 transition';
        iconAutoRotate.classList.remove('animate-spin');
      }
    });

    // GLB Exporter
    document.getElementById('btn-export-glb').addEventListener('click', () => {
      const prevAnim = isLifeAnim;
      isLifeAnim = false;
      resetPoseToStatic();

      if (isWireframe) {
        weeklyCalendarObj.traverse((obj) => {
          if (obj.isMesh && obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach((m) => (m.wireframe = false));
          }
        });
      }

      const fileName = `bailiu_weekly_calendar_${WEEK_META.exportStamp}.glb`;
      showToast(`正在產生 ${fileName} ...`, 'info');

      const exporter = new GLTFExporter();
      exporter.parse(
        weeklyCalendarObj,
        (result) => {
          if (isWireframe) {
            weeklyCalendarObj.traverse((obj) => {
              if (obj.isMesh && obj.material) {
                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                mats.forEach((m) => (m.wireframe = true));
              }
            });
          }
          isLifeAnim = prevAnim;

          if (result instanceof ArrayBuffer) {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const kb = (blob.size / 1024).toFixed(1);
            showToast(`匯出成功！已下載 ${fileName} (${kb} KB)`, 'success');
          } else {
            showToast('匯出格式異常，請重試', 'error');
          }
        },
        (err) => {
          console.error(err);
          isLifeAnim = prevAnim;
          showToast('模型匯出失敗，請重試', 'error');
        },
        { binary: true, onlyVisible: true }
      );
    });

    // =========================================================================
    // 11. Responsive Resize & Render Loop
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    });

    const clock = new THREE.Clock();
    const baseTagAngle = -sampleNeckRingTransform(0.74).tiltAngleZ;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (isLifeAnim && builtInBaiLiuGroup && builtInBaiLiuGroup.visible) {
        const breath = Math.sin(t * 2.4);
        if (animParts.upperBodyGroup) {
          animParts.upperBodyGroup.scale.set(
            1 + breath * 0.011,
            1 + breath * 0.005,
            1 + breath * 0.013
          );
        }
        if (animParts.headGroup) {
          animParts.headGroup.rotation.y = -0.22 + Math.sin(t * 1.1) * 0.04;
          animParts.headGroup.rotation.z = 0.04 + Math.cos(t * 1.5) * 0.02;
        }
        if (animParts.tailGroup) {
          animParts.tailGroup.rotation.y = Math.sin(t * 4.5) * 0.16;
        }
        if (animParts.tagGroup) {
          animParts.tagGroup.rotation.z = baseTagAngle + Math.sin(t * 2.4 + 0.6) * 0.08;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    window.addEventListener('load', () => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
